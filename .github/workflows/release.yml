name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  # Serialize by release target; only rolling builds cancel an older run.
  group: release-${{ inputs.tag || (github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name) || 'main' }}
  cancel-in-progress: ${{ !inputs.tag && !(github.event_name == 'push' && github.ref_type == 'tag') }}

jobs:
  build:
    name: Build ${{ matrix.asset_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target_arch: arm64
            app_bundle_name: OmniDrag
            asset_suffix: arm64
          - runner: macos-15-intel
            target_arch: x86_64
            app_bundle_name: OmniDrag-x86_64
            asset_suffix: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify runner toolchain
        run: |
          sw_vers
          xcodebuild -version
          gh --version || true

      - name: Build app and pkg
        env:
          BUILD_DIR: ${{ github.workspace }}/build/${{ matrix.asset_suffix }}
          DIST_DIR: ${{ github.workspace }}/dist/${{ matrix.asset_suffix }}
          TARGET_ARCH: ${{ matrix.target_arch }}
          APP_BUNDLE_NAME: ${{ matrix.app_bundle_name }}
        run: |
          ./scripts/package.sh
          ditto -c -k --sequesterRsrc --keepParent \
            "$DIST_DIR/${APP_BUNDLE_NAME}.app" \
            "$DIST_DIR/OmniDrag-${{ matrix.asset_suffix }}.app.zip"
          shasum -a 256 \
            "$DIST_DIR/OmniDrag-${{ matrix.asset_suffix }}.app.zip" \
            "$DIST_DIR/OmniDrag-${{ matrix.asset_suffix }}.pkg"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_suffix }}
          path: |
            dist/${{ matrix.asset_suffix }}/OmniDrag-${{ matrix.asset_suffix }}.app.zip
            dist/${{ matrix.asset_suffix }}/OmniDrag-${{ matrix.asset_suffix }}.pkg
          if-no-files-found: error

  publish:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Determine tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_TAG}" ]; then
            TAG="$INPUT_TAG"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF_TYPE" = "tag" && "$GITHUB_REF_NAME" = v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="build-$(date -u +%Y%m%d-%H%M%S)"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          if [[ "$TAG" = build-* ]]; then
            printf 'Automated build.\n\nCommit: %s\nBuilt: %s\n' \
              "$GITHUB_SHA" "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" > release-notes.md
            TITLE="Build $(date -u '+%Y-%m-%d %H:%M UTC')"
            if ! gh release create "$TAG" -R "$REPO" --title "$TITLE" \
              --target "$GITHUB_SHA" --latest --notes-file release-notes.md; then
              gh release edit "$TAG" -R "$REPO" --title "$TITLE" \
                --latest --notes-file release-notes.md
            fi
          else
            if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
              gh release create "$TAG" -R "$REPO" --title "$TAG" --generate-notes
            fi
            gh release edit "$TAG" -R "$REPO" --latest
          fi

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          gh release upload "$TAG" -R "$REPO" release-assets/* --clobber
          gh release view "$TAG" -R "$REPO" --json assets \
            --jq '.assets[] | [.name, .digest, (.size|tostring)] | @tsv'

      - name: Retain the 10 newest build releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          old_builds=$(gh release list -R "$REPO" --limit 200 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.publishedAt) | reverse | .[10:][] | .tagName')
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            if ! gh release delete "$tag" -R "$REPO" --yes --cleanup-tag; then
              echo "Failed to delete build release $tag; continuing."
            fi
          done <<< "$old_builds"
